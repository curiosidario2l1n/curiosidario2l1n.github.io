<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curiosidário 2L-1N</title>
<meta name="description" content="Uma curiosidade por dia em menos de 1 minuto. Links do canal e produtos dos vídeos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--fundo:#14213D;--card:#1F3366;--card2:#25407D;--acento:#FFC93C;--texto:#FFFFFF;--suave:#C9D3EA;--linha:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:'Nunito',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -120px,#22396f 0%,var(--fundo) 60%)}
.wrap{max-width:480px;margin:0 auto;padding:36px 16px 48px}
.topo{text-align:center}
.logo{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 0 0 4px rgba(255,201,60,.25)}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;margin:0;letter-spacing:-.5px}
.selo{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:var(--fundo);background:var(--acento);padding:2px 10px;border-radius:999px;margin-left:6px;vertical-align:middle}
.tag{color:var(--suave);margin:8px 0 22px;font-size:15px}
.redes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.rede{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--card);color:var(--texto);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--linha);transition:transform .15s,background .15s}
.rede:hover,.rede:focus-visible{background:var(--card2);transform:translateY(-2px);outline:none}
.rede svg{width:24px;height:24px}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .pino{width:8px;height:8px;border-radius:50%;background:var(--acento)}
.destaque{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--acento);border-radius:18px;overflow:hidden;margin-bottom:28px}
.destaque img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;display:block}
.destaque .info{padding:14px 16px 16px}
.video{font-size:12px;color:var(--acento);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.nome{font-weight:700;font-size:16px;margin:4px 0 10px;line-height:1.3}
.linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
.preco{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600}
.botao{background:var(--acento);color:var(--fundo);font-weight:700;padding:9px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
.lista{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.item{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:10px;transition:background .15s}
.item:hover,.item:focus-visible{background:var(--card2);outline:none}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#fff;flex-shrink:0}
.item .t{flex:1;min-width:0}
.item .nome{font-size:14px;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .preco{font-size:15px}
.item .seta{color:var(--acento);font-weight:700}
.vazio{background:var(--card);border:1px dashed rgba(255,201,60,.5);border-radius:18px;padding:26px 18px;text-align:center;color:var(--suave);margin-bottom:28px}
.vazio strong{display:block;color:var(--texto);font-family:'Fredoka',sans-serif;font-size:18px;margin-bottom:6px}
.aviso{font-size:12px;color:var(--suave);text-align:center;line-height:1.5;border-top:1px solid var(--linha);padding-top:16px}
</style>
</head>
<body>
<main class="wrap">
  <header class="topo">
    <div class="logo" aria-hidden="true">
      <svg width="62" height="62" viewBox="0 0 560 560"><circle cx="236" cy="236" r="170" fill="#14213D" stroke="#FFC93C" stroke-width="44"/><line x1="362" y1="362" x2="500" y2="500" stroke="#FFC93C" stroke-width="64" stroke-linecap="round"/><text x="236" y="318" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="240" fill="#FFFFFF">?</text></svg>
    </div>
    <h1>Curiosidário<span class="selo">2L-1N</span></h1>
    <p class="tag">🔍 Uma curiosidade por dia, em menos de 1 minuto</p>
  </header>

  <nav class="redes" aria-label="Redes sociais">
    <a class="rede" href="https://www.youtube.com/@Curiosidario2L1N" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#FF3B30"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-4.8.5-4.8s0-3.2-.5-4.8z"/><path d="M9.7 15.1 15.5 12 9.7 8.9z" fill="#fff"/></svg>YouTube</a>
    <a class="rede" href="https://www.tiktok.com/@curiosidario2l1n" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.6 3c.4 2.2 1.8 3.7 4 3.9v3.2c-1.5 0-2.8-.4-4-1.2v6.3a6 6 0 1 1-6-6h.6v3.3a2.8 2.8 0 1 0 2.2 2.7V3z"/></svg>TikTok</a>
    <a class="rede" href="https://www.instagram.com/curiosidario2l1n" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#FF6FB1" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#FF6FB1"/></svg>Instagram</a>
    <a class="rede" href="https://kwai-video.com/u/@curiosidario2l1n/CEsQqWDy" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#FF8A00"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm6 4.5v7l6-3.5z"/></svg>Kwai</a>
  </nav>

  <section id="produtos" aria-live="polite"></section>

  <p class="aviso">Os links de produtos são <strong>links de afiliado</strong>: se você comprar por eles, o canal recebe uma pequena comissão, sem nenhum custo extra para você. Obrigado por apoiar o Curiosidário! 💛</p>
</main>
<script>
(function(){
  var alvo = document.getElementById('produtos');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function preco(p){var n=Number(p);return isFinite(n)&&n>0?'R$ '+n.toFixed(2).replace('.',','):'';}
  function vazio(){alvo.innerHTML='<div class="vazio"><strong>Produtos dos vídeos chegando em breve</strong>Aqui vão aparecer os produtos ligados às curiosidades de cada dia.</div>';}
  fetch('produtos.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var lista=(d&&d.produtos)||[];
    if(!lista.length){vazio();return;}
    var h=lista[0], html='';
    html+='<h2><span class="pino"></span>Produto do vídeo de hoje</h2>';
    html+='<a class="destaque" href="'+esc(h.link)+'" target="_blank" rel="noopener sponsored"><img src="'+esc(h.imagem)+'" alt="'+esc(h.nome)+'" loading="lazy"><div class="info"><div class="video">'+esc(h.video)+'</div><div class="nome">'+esc(h.nome)+'</div><div class="linha"><span class="preco">'+preco(h.preco)+'</span><span class="botao">Ver na Shopee</span></div></div></a>';
    if(lista.length>1){
      html+='<h2><span class="pino"></span>Produtos dos vídeos anteriores</h2><div class="lista">';
      lista.slice(1,30).forEach(function(p){
        html+='<a class="item" href="'+esc(p.link)+'" target="_blank" rel="noopener sponsored"><img src="'+esc(p.imagem)+'" alt="" loading="lazy"><div class="t"><div class="video">'+esc(p.video)+'</div><div class="nome">'+esc(p.nome)+'</div><div class="preco">'+preco(p.preco)+'</div></div><span class="seta">›</span></a>';
      });
      html+='</div>';
    }
    alvo.innerHTML=html;
  }).catch(vazio);
})();
</script>
</body>
</html>
